<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محرر المنشورات الاحترافي</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            margin: 0;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-text-color);
        }
        .group-list {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 10px 0;
        }
        .group-item {
            min-width: 80px;
            text-align: center;
            cursor: pointer;
            padding: 10px;
            background: #eee;
            border-radius: 8px;
            font-size: 12px;
        }
        .group-item.active {
            background: var(--tg-theme-button-color, #2481cc);
            color: white;
        }
        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(45px, 1fr));
            gap: 10px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
        }
        .emoji-item {
            cursor: pointer;
            text-align: center;
            font-size: 24px;
            padding: 5px;
            border-radius: 4px;
            background: #f9f9f9;
        }
        .emoji-item:hover {
            background: #eee;
        }
        .btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            cursor: pointer;
            font-weight: bold;
        }
        .secondary-btn {
            background-color: #6c757d;
        }
        .preview-box {
            border: 1px dashed #aaa;
            padding: 10px;
            border-radius: 8px;
            min-height: 50px;
            white-space: pre-wrap;
            background: rgba(0,0,0,0.05);
        }
        .scheduling {
            border: 1px solid #ddd;
            padding: 10px;
            border-radius: 8px;
        }
        .json-section { display: none; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h3>محرر المنشورات 🎨</h3>

        <textarea id="post-text" placeholder="اكتب نص المنشور هنا...">{{ post.text if post else '' }}</textarea>

        <div id="preview-area" class="preview-box">معاينة المنشور ستظهر هنا...</div>

        <h4>اختر مجموعة إيموجي</h4>
        <div class="group-list">
            {% for group_name, data in emoji_groups.items() %}
            <div class="group-item" id="group-{{ loop.index0 }}" onclick="showGroup('{{ group_name }}', {{ loop.index0 }})">
                <div style="font-size: 20px;">{{ data.preview }}</div>
                <div>{{ group_name }}</div>
            </div>
            {% endfor %}
        </div>

        <div id="emoji-display" class="emoji-grid" style="display: none;">
            <!-- Emojis will be loaded here -->
        </div>

        <div class="scheduling">
            <label>جدولة المنشور (اختياري):</label>
            <input type="datetime-local" id="schedule-time" style="width: 100%; padding: 8px; margin-top: 5px;">
        </div>

        <button class="btn secondary-btn" onclick="toggleJson()">إدخال JSON يدوي</button>

        <div id="json-section" class="json-section">
            <textarea id="manual-json" style="height: 80px;"></textarea>
            <button class="btn" onclick="applyManualJson()" style="width: 100%; margin-top: 5px;">تطبيق JSON</button>
        </div>

        <button class="btn" onclick="saveDraft()">حفظ المسودة 💾</button>
        <button class="btn" onclick="publishNow()" style="background-color: #28a745;">نشر الآن 🚀</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let entities = [];
        const postId = new URLSearchParams(window.location.search).get('post_id');
        const emojiGroups = {{ emoji_groups | tojson }};

        try {
            const initialEntities = '{{ post.entities_json | safe if post and post.entities_json else "[]" }}';
            entities = JSON.parse(initialEntities);
            updatePreview();
        } catch(e) { console.error(e); }

        function showGroup(groupName, index) {
            const display = document.getElementById('emoji-display');
            display.style.display = 'grid';
            display.innerHTML = '';

            // Highlight active group
            document.querySelectorAll('.group-item').forEach(el => el.classList.remove('active'));
            document.getElementById('group-' + index).classList.add('active');

            const group = emojiGroups[groupName];
            group.emojis.forEach(emoji => {
                const div = document.createElement('div');
                div.className = 'emoji-item';
                div.innerText = emoji.text;
                div.onclick = () => insertEmoji(emoji.custom_emoji_id, emoji.text);
                display.appendChild(div);
            });
        }

        function insertEmoji(emojiId, emojiText) {
            const textarea = document.getElementById('post-text');
            const start = textarea.selectionStart;
            const text = textarea.value;

            textarea.value = text.substring(0, start) + emojiText + text.substring(start);

            entities.push({
                type: "custom_emoji",
                offset: start,
                length: emojiText.length,
                custom_emoji_id: emojiId
            });

            updatePreview();
        }

        function updatePreview() {
            const text = document.getElementById('post-text').value;
            document.getElementById('preview-area').innerText = text;
            document.getElementById('manual-json').value = JSON.stringify({entities: entities}, null, 2);
        }

        document.getElementById('post-text').addEventListener('input', updatePreview);

        function toggleJson() {
            const section = document.getElementById('json-section');
            section.style.display = section.style.display === 'none' ? 'block' : 'none';
        }

        function applyManualJson() {
            try {
                const data = JSON.parse(document.getElementById('manual-json').value);
                if(data.entities) {
                    entities = data.entities;
                    updatePreview();
                }
            } catch(e) { tg.showAlert("خطأ في صيغة JSON"); }
        }

        async function apiRequest(endpoint, body) {
            return fetch(endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Telegram-Init-Data': tg.initData
                },
                body: JSON.stringify(body)
            });
        }

        async function saveDraft() {
            const text = document.getElementById('post-text').value;
            const schedule = document.getElementById('schedule-time').value;
            const response = await apiRequest('/save_post', {
                post_id: postId,
                text: text,
                entities: entities,
                scheduled_at: schedule
            });
            const res = await response.json();
            if(res.status === 'success') tg.showAlert("تم حفظ المسودة بنجاح!");
        }

        async function publishNow() {
            tg.showConfirm("هل أنت متأكد من النشر؟", async (ok) => {
                if(ok) {
                    await saveDraft();
                    const response = await apiRequest('/publish_now', { post_id: postId });
                    const res = await response.json();
                    if(res.status === 'success') tg.close();
                    else tg.showAlert("فشل النشر: " + res.message);
                }
            });
        }
    </script>
</body>
</html>
