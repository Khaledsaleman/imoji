<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>محرر المنشورات الاحترافي</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --tg-color-primary: #2481cc;
            --tg-color-secondary: #50a2e9;
            --tg-color-bg: #ffffff;
            --tg-color-text: #000000;
            --tg-color-hint: #999999;
            --tg-color-button: #2481cc;
            --tg-color-button-text: #ffffff;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--tg-theme-bg-color, #f0f2f5);
            color: var(--tg-theme-text-color, #000000);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(var(--tg-theme-secondary-bg-color-rgb, 255, 255, 255), 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
        }

        .dark .glass-panel {
            background: rgba(30, 30, 30, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .gradient-text {
            background: linear-gradient(135deg, #2481cc 0%, #50a2e9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .fade-in-contrast {
            animation: fadeInContrast 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes fadeInContrast {
            from {
                opacity: 0;
                filter: contrast(1.5) brightness(1.2);
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                filter: contrast(1) brightness(1);
                transform: translateY(0);
            }
        }

        .emoji-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .emoji-card:active {
            transform: scale(0.92);
            background: var(--tg-theme-button-color, #2481cc);
            color: white;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }

        /* Telegram Theme Colors Mapping */
        .bg-tg-main { background-color: var(--tg-theme-bg-color); }
        .bg-tg-secondary { background-color: var(--tg-theme-secondary-bg-color); }
        .text-tg-main { color: var(--tg-theme-text-color); }
        .text-tg-hint { color: var(--tg-theme-hint-color); }
        .border-tg { border-color: rgba(var(--tg-theme-hint-color-rgb, 153, 153, 153), 0.2); }
    </style>
</head>
<body class="p-4 md:p-6 bg-tg-main">
    <div class="max-w-md mx-auto space-y-6 fade-in-contrast">
        <!-- Header -->
        <header class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-blue-500/30">
                    <span class="text-2xl">🎨</span>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-tg-main">محرر المنشورات</h1>
                    <p class="text-xs text-tg-hint">نسخة احترافية v2.0</p>
                </div>
            </div>
            <div class="text-tg-hint hover:text-tg-main transition-colors cursor-pointer" onclick="tg.close()">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </div>
        </header>

        <!-- Channel Selector -->
        <section id="channel-selector" class="glass-panel p-3 border-tg">
            <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-bold text-tg-hint mr-1">النشر في قناة:</span>
            </div>
            <div id="channels-list" class="flex gap-3 overflow-x-auto pb-1 custom-scrollbar">
                <!-- Channels will be loaded here -->
            </div>
        </section>

        <!-- Editor Section -->
        <div class="glass-panel p-5 space-y-4 shadow-sm border-tg">
            <div class="flex items-center justify-between">
                <span class="text-sm font-bold text-tg-main">محتوى المنشور</span>
                <span id="char-count" class="text-xs text-tg-hint">0 حرف</span>
            </div>
            <textarea
                id="post-text"
                class="w-100 w-full h-40 bg-transparent text-tg-main placeholder-tg-hint focus:outline-none resize-none text-base leading-relaxed custom-scrollbar"
                placeholder="اكتب فكرتك هنا..."></textarea>

            <div id="preview-area" class="hidden p-3 rounded-xl bg-black/5 dark:bg-white/5 text-sm text-tg-main whitespace-pre-wrap border border-dashed border-tg">
                <!-- Preview content -->
            </div>
        </div>

        <!-- Emoji Groups Grid -->
        <section class="space-y-4">
            <h2 class="text-sm font-bold text-tg-main mr-2">مجموعات الإيموجي المميزة</h2>
            <div class="grid grid-cols-2 gap-3">
                {% for group_name, data in emoji_groups.items() %}
                <button
                    onclick="showGroup('{{ group_name }}', {{ loop.index0 }})"
                    id="group-{{ loop.index0 }}"
                    class="group-item glass-panel p-4 flex flex-col items-center gap-2 hover:scale-[1.02] transition-transform duration-200 border-tg active:scale-95 text-center">
                    <span class="text-3xl mb-1 drop-shadow-md">{{ data.preview }}</span>
                    <span class="text-xs font-medium text-tg-main truncate w-full">{{ group_name }}</span>
                </button>
                {% endfor %}
            </div>
        </section>

        <!-- Emoji Display Area (Hidden by default) -->
        <div id="emoji-container" class="hidden fade-in-contrast">
            <div class="glass-panel p-4 space-y-4 border-tg border-blue-500/30">
                <div class="flex items-center justify-between border-b border-tg pb-3">
                    <span id="active-group-name" class="text-sm font-bold text-tg-main truncate max-w-[200px]">المجموعة المختارة</span>
                    <button onclick="hideEmojis()" class="text-xs text-blue-500 font-bold px-2 py-1">إخفاء</button>
                </div>
                <div id="emoji-display" class="grid grid-cols-5 gap-3 max-h-48 overflow-y-auto custom-scrollbar p-1">
                    <!-- Emojis will be loaded here -->
                </div>
            </div>
        </div>

        <!-- Scheduling -->
        <div class="glass-panel p-5 space-y-4 border-tg">
            <div class="flex items-center gap-2 text-tg-main">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span class="text-sm font-bold">جدولة المنشور</span>
            </div>
            <input
                type="datetime-local"
                id="schedule-time"
                class="w-full bg-black/5 dark:bg-white/5 rounded-xl p-3 text-sm text-tg-main focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all border-tg">
        </div>

        <!-- Actions -->
        <div class="grid grid-cols-2 gap-4 pb-8">
            <button
                onclick="saveDraft()"
                class="bg-tg-secondary/10 text-blue-500 font-bold py-4 rounded-2xl border border-blue-500/20 active:scale-95 transition-transform">
                حفظ مسودة
            </button>
            <button
                onclick="publishNow()"
                class="bg-gradient-to-r from-blue-500 to-indigo-600 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-500/30 active:scale-95 transition-transform">
                نشر الآن 🚀
            </button>
        </div>
    </div>

    <!-- JSON Section (Hidden for advanced users) -->
    <div class="max-w-md mx-auto pb-12">
        <button onclick="toggleJson()" class="text-xs text-tg-hint underline w-full text-center">إعدادات متقدمة (JSON)</button>
        <div id="json-section" class="hidden mt-4 glass-panel p-4 space-y-3">
            <textarea id="manual-json" class="w-full h-32 bg-black/5 dark:bg-white/5 rounded-lg p-3 text-xs font-mono text-tg-main focus:outline-none"></textarea>
            <button onclick="applyManualJson()" class="w-full py-2 bg-tg-main text-tg-main border border-tg rounded-lg text-xs font-bold">تطبيق</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Enable Dark Mode based on Telegram Theme
        if (tg.colorScheme === 'dark') {
            document.documentElement.classList.add('dark');
        }

        let entities = [];
        let selectedChannelId = '{{ post.channel_id if post and post.channel_id else "" }}';
        const postId = new URLSearchParams(window.location.search).get('post_id');
        const emojiGroups = {{ emoji_groups | tojson }};

        let currentGroupEmojis = [];
        let itemsToShow = 15;
        const PAGE_SIZE = 15;
        let groupCache = {};

        // Initialize state
        try {
            const initialText = '{{ post.text if post else "" }}'.replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>');
            const initialEntities = '{{ post.entities_json | safe if post and post.entities_json else "[]" }}';
            document.getElementById('post-text').value = initialText;
            entities = JSON.parse(initialEntities);
            updateCharCount();
            loadChannels();
        } catch(e) { console.error(e); }

        async function loadChannels() {
            try {
                const response = await fetch('/api/channels');
                const channels = await response.json();
                const container = document.getElementById('channels-list');
                container.innerHTML = '';

                channels.forEach(ch => {
                    const btn = document.createElement('button');
                    const isActive = selectedChannelId == ch.id;
                    btn.className = `flex-shrink-0 flex items-center gap-2 p-2 rounded-xl border transition-all ${isActive ? 'bg-blue-500/10 border-blue-500 scale-105' : 'border-tg opacity-70'}`;
                    btn.id = `channel-btn-${ch.id}`;

                    const img = ch.photo ? `<img src="${ch.photo}" class="w-8 h-8 rounded-full">` : `<div class="w-8 h-8 rounded-full bg-blue-500/20 flex items-center justify-center text-xs">📺</div>`;

                    btn.innerHTML = `${img}<span class="text-xs font-bold text-tg-main">${ch.title}</span>`;
                    btn.onclick = () => selectChannel(ch.id);
                    container.appendChild(btn);
                });

                if (!selectedChannelId && channels.length > 0) {
                    selectChannel(channels[0].id);
                }
            } catch(e) { console.error(e); }
        }

        function selectChannel(id) {
            document.querySelectorAll('[id^="channel-btn-"]').forEach(el => {
                el.classList.remove('bg-blue-500/10', 'border-blue-500', 'scale-105');
                el.classList.add('opacity-70', 'border-tg');
            });
            const selected = document.getElementById(`channel-btn-${id}`);
            if (selected) {
                selected.classList.add('bg-blue-500/10', 'border-blue-500', 'scale-105');
                selected.classList.remove('opacity-70', 'border-tg');
            }
            selectedChannelId = id;
            tg.HapticFeedback.impactOccurred('light');
        }

        async function fetchWithRetry(url, options = {}, retries = 3, backoff = 500) {
            try {
                const response = await fetch(url, options);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return await response.json();
            } catch (e) {
                if (retries > 0) {
                    console.log(`Retry left: ${retries}. Retrying in ${backoff}ms...`);
                    await new Promise(resolve => setTimeout(resolve, backoff));
                    return fetchWithRetry(url, options, retries - 1, backoff * 2);
                }
                throw e;
            }
        }

        let activeGroupName = '';

        async function showGroup(groupName, index) {
            const container = document.getElementById('emoji-container');
            const display = document.getElementById('emoji-display');
            const nameEl = document.getElementById('active-group-name');

            activeGroupName = groupName;
            nameEl.innerText = groupName;
            display.innerHTML = '<div class="col-span-5 text-center text-xs text-tg-hint py-4 flex flex-col items-center gap-2"><span>جاري التحميل...</span><div class="w-4 h-4 border-2 border-blue-500 border-t-transparent rounded-full animate-spin"></div></div>';

            // Highlight active group
            document.querySelectorAll('.group-item').forEach(el => el.classList.remove('ring-2', 'ring-blue-500', 'bg-blue-500/10'));
            const activeGroup = document.getElementById('group-' + index);
            activeGroup.classList.add('ring-2', 'ring-blue-500', 'bg-blue-500/10');

            container.classList.remove('hidden');
            container.classList.add('fade-in-contrast');
            container.scrollIntoView({ behavior: 'smooth', block: 'center' });

            if (groupCache[groupName]) {
                currentGroupEmojis = groupCache[groupName];
                display.innerHTML = '';
                itemsToShow = PAGE_SIZE;
                renderEmojis();
            } else {
                try {
                    currentGroupEmojis = await fetchWithRetry(`/api/emojis/${encodeURIComponent(groupName)}`);
                    groupCache[groupName] = currentGroupEmojis;
                    display.innerHTML = '';
                    itemsToShow = PAGE_SIZE;
                    renderEmojis();
                } catch(e) {
                    display.innerHTML = `
                        <div class="col-span-5 text-center text-xs text-red-500 py-4 flex flex-col items-center gap-2">
                            <span>فشل تحميل المجموعة</span>
                            <button onclick="showGroup('${groupName}', ${index})" class="px-3 py-1 bg-blue-500 text-white rounded-lg text-[10px]">إعادة المحاولة</button>
                        </div>
                    `;
                }
            }
        }

        function renderEmojis() {
            const display = document.getElementById('emoji-display');
            const emojisToRender = currentGroupEmojis.slice(display.childElementCount, itemsToShow);

            emojisToRender.forEach(emoji => {
                const container = document.createElement('div');
                container.className = 'flex flex-col items-center gap-1';

                const btn = document.createElement('button');
                btn.className = 'emoji-card w-full h-16 flex items-center justify-center rounded-xl bg-black/5 dark:bg-white/5 hover:bg-blue-500/20 active:bg-blue-500 overflow-hidden relative';

                const emojiId = emoji.custom_emoji_id || emoji.id || emoji.emoji_id;
                const emojiText = emoji.text || "✨";
                const uniqueId = emoji.unique_id || `id_${emojiId}`;

                if (emoji.is_lottie) {
                    const lottieDiv = document.createElement('div');
                    lottieDiv.className = 'w-10 h-10';
                    btn.appendChild(lottieDiv);

                    // Load animation
                    lottie.loadAnimation({
                        container: lottieDiv,
                        renderer: 'svg',
                        loop: true,
                        autoplay: true,
                        path: `/api/emoji_raw/${encodeURIComponent(activeGroupName)}/${emojiId}`
                    });
                } else {
                    const textSpan = document.createElement('span');
                    textSpan.className = 'text-2xl';
                    textSpan.innerText = emojiText;
                    btn.appendChild(textSpan);
                }

                if (emojiId) {
                    btn.onclick = () => insertEmoji(emojiId, emoji.is_lottie ? "🦆" : emojiText);
                } else {
                    btn.classList.add('opacity-50', 'cursor-not-allowed');
                }

                const idLabel = document.createElement('span');
                idLabel.className = 'text-[8px] text-tg-hint font-mono truncate w-full text-center';
                idLabel.innerText = `ID: ${emojiId}`;

                const uniqueLabel = document.createElement('span');
                uniqueLabel.className = 'text-[7px] text-blue-500/50 font-mono truncate w-full text-center';
                uniqueLabel.innerText = uniqueId;

                container.appendChild(btn);
                container.appendChild(idLabel);
                container.appendChild(uniqueLabel);
                display.appendChild(container);
            });
        }

        // Infinite scroll listener for emoji display
        document.getElementById('emoji-display').addEventListener('scroll', function(e) {
            const { scrollTop, scrollHeight, clientHeight } = e.target;
            if (scrollTop + clientHeight >= scrollHeight - 20) {
                if (itemsToShow < currentGroupEmojis.length) {
                    itemsToShow += PAGE_SIZE;
                    renderEmojis();
                }
            }
        });

        function hideEmojis() {
            document.getElementById('emoji-container').classList.add('hidden');
            document.querySelectorAll('.group-item').forEach(el => el.classList.remove('ring-2', 'ring-blue-500', 'bg-blue-500/10'));
        }

        function insertEmoji(emojiId, emojiText) {
            if (!emojiId || emojiId === "undefined") {
                tg.showAlert("خطأ: معرف الإيموجي غير موجود");
                return;
            }

            const textarea = document.getElementById('post-text');
            const start = textarea.selectionStart;
            const text = textarea.value;

            // Shift existing entities that are after the insertion point
            entities.forEach(entity => {
                if (entity.offset >= start) {
                    entity.offset += emojiText.length;
                }
            });

            textarea.value = text.substring(0, start) + emojiText + text.substring(start);

            entities.push({
                type: "custom_emoji",
                offset: start,
                length: emojiText.length,
                custom_emoji_id: String(emojiId)
            });

            updateCharCount();
            tg.HapticFeedback.impactOccurred('light');

            // Set focus back to textarea and restore cursor position
            textarea.focus();
            const newCursorPos = start + emojiText.length;
            textarea.setSelectionRange(newCursorPos, newCursorPos);
        }

        function updateCharCount() {
            const text = document.getElementById('post-text').value;
            document.getElementById('char-count').innerText = text.length + " حرف";
            document.getElementById('manual-json').value = JSON.stringify({entities: entities}, null, 2);
        }

        document.getElementById('post-text').addEventListener('input', updateCharCount);

        function toggleJson() {
            const section = document.getElementById('json-section');
            section.classList.toggle('hidden');
        }

        function applyManualJson() {
            try {
                const data = JSON.parse(document.getElementById('manual-json').value);
                if(data.entities) {
                    entities = data.entities;
                    tg.showScanQrPopup({text: "تم تطبيق الإعدادات بنجاح"}); // Not really QR but just to use TG API
                }
            } catch(e) { tg.showAlert("خطأ في صيغة JSON"); }
        }

        async function apiRequest(endpoint, body) {
            return fetch(endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Telegram-Init-Data': tg.initData
                },
                body: JSON.stringify(body)
            });
        }

        async function saveDraft() {
            tg.MainButton.showProgress();
            const text = document.getElementById('post-text').value;
            const schedule = document.getElementById('schedule-time').value;

            try {
                const response = await apiRequest('/save_post', {
                    post_id: postId,
                    text: text,
                    entities: entities,
                    scheduled_at: schedule,
                    channel_id: selectedChannelId
                });
                const res = await response.json();
                if(res.status === 'success') {
                    tg.HapticFeedback.notificationOccurred('success');
                    tg.showAlert("تم حفظ المسودة بنجاح! ✨");
                }
            } catch(e) {
                tg.showAlert("حدث خطأ أثناء الحفظ");
            } finally {
                tg.MainButton.hideProgress();
            }
        }

        async function publishNow() {
            tg.showConfirm("هل أنت متأكد من رغبتك في نشر المنشور الآن؟", async (ok) => {
                if(ok) {
                    tg.MainButton.showProgress();
                    const text = document.getElementById('post-text').value;
                    const schedule = document.getElementById('schedule-time').value;

                    try {
                        const response = await apiRequest('/publish_now', {
                            post_id: postId,
                            text: text,
                            entities: entities,
                            scheduled_at: schedule,
                            channel_id: selectedChannelId
                        });
                        const res = await response.json();
                        if(res.status === 'success') {
                            tg.HapticFeedback.notificationOccurred('success');
                            tg.close();
                        } else {
                            tg.showAlert("فشل النشر: " + res.message);
                        }
                    } catch(e) {
                        tg.showAlert("حدث خطأ أثناء النشر");
                    } finally {
                        tg.MainButton.hideProgress();
                    }
                }
            });
        }
    </script>
</body>
</html>
